name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the evidence gate reads the commit history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up the environment
        run: make setup
      - name: Lint, format check, tests and evaluation gate
        run: make verify
