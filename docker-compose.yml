# Start everything with:  docker compose up --build
# Then open http://localhost:8000/docs (API) or call http://localhost:8000/health.
services:
  scamcheck:
    build: .
    image: scamcheck:local
    ports:
      # Loopback only: the demo has no authentication.
      - "127.0.0.1:8000:8000"
    environment:
      SCAMCHECK_AUDIT_PATH: /app/audit/decisions.jsonl
      # Demo mode enables POST /v1/demo/model-failure (to show degraded mode). Off by default.
      # SCAMCHECK_DEMO_MODE: "1"
    volumes:
      - audit-data:/app/audit
    restart: unless-stopped

volumes:
  audit-data:
